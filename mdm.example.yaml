# mdm の設定の例。mdm.yaml にコピーして使う。

storage:
  sqlite: mdm.db

# 管理の API。家の中・VPN の中からだけ届く場所で待ち受ける。
# 127.0.0.1 以外で待ち受けるなら tls が要る。
admin:
  listen: 127.0.0.1:8091
  # tls:
  #   cert: /etc/mdm/admin-cert.pem
  #   key: /etc/mdm/admin-key.pem
  tokens:
    # mdm admin-token で作った sha256 を書く（鍵そのものは書かない）。
    - name: parent
      sha256: "<64 桁の 16 進>"
      # role: org_admin   # 省けば server_admin
      # org_id: org_...

# 管理者が IAM でログインする設定。IAM にこの MDM を機密クライアントとして登録する。
# oidc:
#   issuer: https://iam.example.com
#   client_id: mdm
#   client_secret: "<IAM が発行した client_secret>"
#   audience: mdm   # トークンの aud に求める値（空なら求めない）

# 端末から届く入り口（DoH と、iPhone・Mac の設定のプロファイル）。
public:
  listen: ":8090"
  # 端末から見えるアドレス。前にリバースプロキシ（Caddy など）を置いて HTTPS にするか、tls を書く。
  base_url: https://dns.example.com
  # tls:
  #   cert: /etc/mdm/cert.pem
  #   key: /etc/mdm/key.pem

# Android の「プライベート DNS」向けの DNS over TLS。使わないなら listen を書かない。
# 端末のホスト名は {ラベル}.{domain} になるので、*.{domain} の証明書と、
# 公開の DNS の *.{domain} の A・AAAA レコード、TCP 853 番の開放が要る。
# dot:
#   listen: ":853"
#   domain: dns.example.com
#   tls:
#     cert: /etc/mdm/wildcard.pem
#     key: /etc/mdm/wildcard-key.pem

# 通したものを問い合わせる先。doh か plain のどちらか。
upstream:
  doh: https://1.1.1.1/dns-query
  # plain: 192.168.1.1:53

filter:
  # 止める時間帯でも止めない通信。書かなければ、端末の管理（プッシュ）と時刻合わせの分が入る。
  # always_allow: [push.apple.com, mtalk.google.com]
  query_log_retention_days: 30

blocklists:
  refresh_interval: 24h

# Android の端末の管理（Google の Android Management API）。使わないなら書かない。
# Google Cloud のプロジェクトで API を有効にし、サービスアカウントの鍵（JSON）を置く。
# android:
#   project_id: my-mdm-project
#   credentials_file: /etc/mdm/android-service-account.json
#   sync_interval: 5m

# Windows の端末の管理（Windows 標準の MDM）。使わないなら書かない。
# 端末は TLS のクライアント証明書で自分を示すので、リバースプロキシを通さずにここで TLS を受ける。
# windows:
#   listen: ":8443"
#   base_url: https://mdm.example.com:8443
#   tls:
#     cert: /etc/mdm/mdm-cert.pem
#     key: /etc/mdm/mdm-key.pem
#   # 端末の証明書を発行する認証局。無ければ最初の起動で作る。鍵は大切に保管する。
#   ca_cert: /var/lib/mdm/windows-ca.pem
#   ca_key: /var/lib/mdm/windows-ca-key.pem
#   poll_minutes: 15

# iPhone・iPad・Mac を Apple 標準の MDM で管理するとき（README の「iPhone・Mac の準備」）。
# 端末は証明書で自分を示すので、リバースプロキシを通さず、ここで TLS を受ける。
# base_url のホスト名（windows も同じ）は、通信フィルターでいつも通す。
# apple:
#   listen: ":9443"
#   base_url: https://mdm.example.com:9443
#   tls:
#     cert: /etc/mdm/mdm-cert.pem
#     key: /etc/mdm/mdm-key.pem
#   # Apple Push Certificates Portal で取った MDM の通知用の証明書と、その CSR を作った鍵（PEM）。1 年ごとに更新する。
#   push_cert: /etc/mdm/apple-push-cert.pem
#   push_key: /etc/mdm/apple-push-key.pem
#   # 端末の証明書を発行する認証局。無ければ最初の起動で作る。鍵は大切に保管する。
#   ca_cert: /var/lib/mdm/apple-ca.pem
#   ca_key: /var/lib/mdm/apple-ca-key.pem
#   sync_interval: 1h
