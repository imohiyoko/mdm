# mdm の設定の例。mdm.yaml にコピーして使う。

storage:
  sqlite: mdm.db

# 管理の API。家の中・VPN の中からだけ届く場所で待ち受ける。
# 127.0.0.1 以外で待ち受けるなら tls が要る。
admin:
  listen: 127.0.0.1:8091
  # tls:
  #   cert: /etc/mdm/admin-cert.pem
  #   key: /etc/mdm/admin-key.pem
  # ブラウザーから届く管理の入り口。oidc と一緒に書くと管理画面（{base_url}/ui/）を使える。
  # IAM の連携先（oidc.client_id）の戻り先に {base_url}/ui/callback を登録する。
  # base_url: https://mdm-admin.example.com
  tokens:
    # mdm admin-token で作った sha256 を書く（鍵そのものは書かない）。
    - name: parent
      sha256: "<64 桁の 16 進>"
      # role: org_admin   # 省けば server_admin
      # org_id: org_...

# 管理者が IAM でログインする設定。IAM にこの MDM を機密クライアントとして登録する。
# oidc:
#   issuer: https://iam.example.com
#   client_id: mdm
#   client_secret: "<IAM が発行した client_secret>"
#   audience: mdm   # トークンの aud に求める値（必須。ふつうは client_id と同じ）

# 組織ごとの上限の既定（0 か書かなければ上限なし）。組織ごとの値はサーバーの管理者が PUT /v1/orgs/{id}/limits で決める。
# limits:
#   devices: 20
#   people: 20
#   groups: 20
#   policies: 20

# IAM でログインした人が自分で組織を作れるようにする（SaaS として動かすとき。oidc が要る）。
# 作った人はその組織の管理者になり、招待のコードでほかの管理者を足せる。
# signup:
#   enabled: true
#   max_orgs_per_user: 3

# ルールの API（AI・自動化・IaC からポリシーのルールを読み書きする。api/rules/openapi/public.json）。
# rules_api:
#   listen: 127.0.0.1:8093
#   tls:                 # 127.0.0.1・::1 以外で待ち受けるなら要る
#     cert: /etc/mdm/rules.pem
#     key: /etc/mdm/rules-key.pem

# 端末から届く入り口（DoH と、iPhone・Mac の設定のプロファイル）。
public:
  listen: ":8090"
  # 端末から見えるアドレス。前にリバースプロキシ（Caddy など）を置いて HTTPS にするか、tls を書く。
  base_url: https://dns.example.com
  # tls:
  #   cert: /etc/mdm/cert.pem
  #   key: /etc/mdm/key.pem

# Android の「プライベート DNS」向けの DNS over TLS。使わないなら listen を書かない。
# 端末のホスト名は {ラベル}.{domain} になるので、*.{domain} の証明書と、
# 公開の DNS の *.{domain} の A・AAAA レコード、TCP 853 番の開放が要る。
# dot:
#   listen: ":853"
#   domain: dns.example.com
#   tls:
#     cert: /etc/mdm/wildcard.pem
#     key: /etc/mdm/wildcard-key.pem

# 通したものを問い合わせる先。doh か plain のどちらか。
upstream:
  doh: https://1.1.1.1/dns-query
  # plain: 192.168.1.1:53

filter:
  # 止める時間帯でも止めない通信。書かなければ、端末の管理（プッシュ）と時刻合わせの分が入る。
  # always_allow: [push.apple.com, mtalk.google.com]
  query_log_retention_days: 30

blocklists:
  refresh_interval: 24h

# Android の端末の管理（Google の Android Management API）。使わないなら書かない。
# Google Cloud のプロジェクトで API を有効にし、サービスアカウントの鍵（JSON）を置く。
# android:
#   project_id: my-mdm-project
#   credentials_file: /etc/mdm/android-service-account.json
#   sync_interval: 5m

# Windows の端末の管理（Windows 標準の MDM）。使わないなら書かない。
# 端末は TLS のクライアント証明書で自分を示すので、リバースプロキシを通さずにここで TLS を受ける。
# windows:
#   listen: ":8443"
#   base_url: https://mdm.example.com:8443
#   tls:
#     cert: /etc/mdm/mdm-cert.pem
#     key: /etc/mdm/mdm-key.pem
#   # 端末の証明書を発行する認証局。無ければ最初の起動で作る。鍵は大切に保管する。
#   ca_cert: /var/lib/mdm/windows-ca.pem
#   ca_key: /var/lib/mdm/windows-ca-key.pem
#   poll_minutes: 15

# iPhone・iPad・Mac を Apple 標準の MDM で管理するとき（README の「iPhone・Mac の準備」）。
# 端末は証明書で自分を示すので、リバースプロキシを通さず、ここで TLS を受ける。
# base_url のホスト名（windows も同じ）は、通信フィルターでいつも通す。
# apple:
#   listen: ":9443"
#   base_url: https://mdm.example.com:9443
#   tls:
#     cert: /etc/mdm/mdm-cert.pem
#     key: /etc/mdm/mdm-key.pem
#   # Apple Push Certificates Portal で取った MDM の通知用の証明書と、その CSR を作った鍵（PEM）。1 年ごとに更新する。
#   # 組織が自分の証明書を入れていないときに使う。書かなければ、組織の管理者が /v1/orgs/{id}/apple/push で入れる。
#   push_cert: /etc/mdm/apple-push-cert.pem
#   push_key: /etc/mdm/apple-push-key.pem
#   # MDM の提供者（ベンダー）の証明書と鍵。あれば、組織の通知用の証明書の要求に署名する（組織は Apple のサイトに上げるだけ）。
#   # vendor_cert には Apple の中間証明書（WWDR）とルート証明書もつなげる。
#   vendor_cert: /etc/mdm/apple-vendor-chain.pem
#   vendor_key: /etc/mdm/apple-vendor-key.pem
#   # 端末の証明書を発行する認証局。無ければ最初の起動で作る。鍵は大切に保管する。
#   ca_cert: /var/lib/mdm/apple-ca.pem
#   ca_key: /var/lib/mdm/apple-ca-key.pem
#   sync_interval: 1h

# 端末の準拠の判定（ポリシーの compliance の条件）。interval ごとにすべての端末を判定する。
# compliance:
#   interval: 1m

# 準拠の状態が変わったら iam に知らせる（SSF。README の「端末の準拠を IAM に知らせる」）。
# ssf:
#   signing_key: /var/lib/mdm/ssf-key.pem   # 無ければ最初の起動で作る
#   receivers:
#     - name: iam
#       url: https://iam.example.com/ssf/receiver/stx_...
#       push_token_file: /etc/mdm/iam-ssf-push-token   # iam が登録のときに 1 度だけ返す ssfpt_…
#       audience: https://dns.example.com              # iam の送信側の登録の audience と同じ値
#       org_ids: [org_...]                             # 必須。この組織の端末の知らせだけを送る

# 証明書で Wi-Fi に入る（README の「証明書で Wi-Fi に入る」）。ルーターを WPA2・WPA3 Enterprise にし、RADIUS のサーバーをここにする。
# radius:
#   listen: ":1812"
#   server_name: radius.home.example   # サーバーの証明書の名前。端末の Wi-Fi の設定の「ドメイン」に入れる
#   # ネットワークの認証局。無ければ最初の起動で作る。鍵は大切に保管する。server_name を変えたら作り直す。
#   ca_cert: /var/lib/mdm/network-ca.pem
#   ca_key: /var/lib/mdm/network-ca-key.pem
#   require_compliant: false           # true なら準拠している端末だけを入れる
#   # RadSec（RADIUS over TLS、TCP）。組織の管理者が証明書で見分けるルーターを登録できる。書けば clients は無くてもよい
#   radsec_listen: ":2083"
#   radsec_address: radius.home.example:2083   # ルーターに設定させるつなぎ先。無ければ server_name と radsec_listen のポート
#   radsec_ca_cert: /var/lib/mdm/radsec-ca.pem # ルーターの証明書の認証局。無ければ最初の起動で作る
#   radsec_ca_key: /var/lib/mdm/radsec-ca-key.pem
#   clients:
#     - name: home-router
#       address: 192.168.1.1           # IP か CIDR
#       secret_file: /etc/mdm/radius-secret-home-router   # 16 文字以上。ルーターにも同じものを入れる
#       org_ids: [org_...]             # 書けば、この組織の端末だけを入れる（組織ごとの Wi-Fi）
